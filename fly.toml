app = "tss-realtime"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3331"
  CORS_ORIGINS = "https://tku-sparring.vercel.app,https://tku-sparring.localhost"

[http_service]
  internal_port = 3331
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "256mb"
