# fly.toml app configuration file generated for tss-realtime on 2026-05-15T05:36:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "tss-realtime"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3331"
  CORS_ORIGINS = "https://tku-sparring.vercel.app,https://tku-sparring.localhost,https://tss.localhost"

[http_service]
  internal_port = 3331
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpus = 2
  cpu_kind = 'shared'
  memory = '512mb'
  memory_mb = 512
